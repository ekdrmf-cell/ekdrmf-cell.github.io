<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="alternate icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NR3D3FD597"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NR3D3FD597');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>무료 꿈해몽 검색 — 서비스허브</title>
<meta name="description" content="꿈에 나온 대상을 검색하면 전통 꿈해몽 풀이를 바로 보여드립니다." />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../saju/css/saju.css" />
<script src="../js/config.js"></script>
</head>
<body data-active="saju" data-root="../">
<header id="site-header" class="site-header"></header>

<div class="saju-wrap">
  <h1 class="saju-title">무료 꿈해몽 검색</h1>
  <p class="saju-sub">꿈에서 뭘 보셨나요? 키워드를 입력해보세요. (예: 돼지, 물, 이빨)</p>

  <form class="saju-form" id="dream-form">
    <input type="text" id="dream-input" placeholder="꿈에 나온 것을 입력하세요" style="background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;" />
    <button type="submit" class="saju-submit">해몽 검색</button>
  </form>

  <div id="dream-result"></div>

  <div class="upsell-card" id="dream-upsell" style="display:none;margin-top:16px;">
    <h3>이 꿈이 지금 내 상황과 어떻게 이어지는지 궁금하다면?</h3>
    <p>검색 결과를 바탕으로 개인 맞춤 해석을 만들어드립니다.</p>
    <button id="upsell-btn">상세 해석 신청하기</button>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/dream-data.js"></script>
<script>
  const resultEl = document.getElementById("dream-result");
  const upsellEl = document.getElementById("dream-upsell");

  document.getElementById("dream-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = document.getElementById("dream-input").value;
    const matches = searchDream(q);
    gtag('event', 'dream_search', { query: q, matched: matches.length });

    if (!matches.length) {
      resultEl.innerHTML = `<div class="oheng-card"><p class="oheng-summary">"${q}"에 대한 풀이를 아직 못 찾았어요. 다른 표현으로 다시 검색해보시거나(예: "뱀꿈"→"뱀"), 자주 검색되는 키워드를 참고해보세요: 돼지·용·뱀·이빨·물·불·똥·돈·시험·임신·결혼·이사·호랑이</p></div>`;
      upsellEl.style.display = "none";
      return;
    }
    resultEl.innerHTML = matches.map((d) => `
      <div class="oheng-card tarot-result-card">
        <div class="emoji">${d.emoji}</div>
        <h2>${d.title}</h2>
        <p class="oheng-summary">${d.text}</p>
      </div>
    `).join("");
    upsellEl.style.display = "block";
    resultEl.scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("upsell-btn").addEventListener("click", () => {
    contactPurchase("꿈해몽 상세 해석 신청", "무료 꿈해몽 검색 결과로 상세 해석을 받고 싶습니다. 검색어: " + document.getElementById("dream-input").value);
  });
</script>
<script src="../js/common.js"></script>
</body>
</html>
