<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="alternate icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NR3D3FD597"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NR3D3FD597');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>무료 사주 계산기 — 서비스허브</title>
<meta name="description" content="생년월일시만 입력하면 띠·별자리·타고난 기운을 쉬운 말로 바로 보여주는 무료 사주 계산기." />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="css/saju.css" />
<script src="../js/config.js"></script>
</head>
<body data-active="saju" data-root="../">
<header id="site-header" class="site-header"></header>

<div class="saju-wrap">
  <h1 class="saju-title">무료 사주 계산기</h1>
  <p class="saju-sub">생년월일시만 입력하면 띠·별자리·타고난 기운을 쉬운 말로 바로 보여드려요.</p>

  <form class="saju-form" id="saju-form">
    <div class="row">
      <select id="f-year" required></select>
      <select id="f-month" required></select>
      <select id="f-day" required></select>
    </div>
    <div class="row">
      <select id="f-hour"></select>
      <label class="check"><input type="checkbox" id="f-unknown-time" /> 태어난 시간을 몰라요</label>
    </div>
    <button type="submit" class="saju-submit">내 사주 보기</button>
  </form>

  <div id="saju-result">
    <div class="result-hero">
      <div class="badge-big" id="r-emoji">🐉</div>
      <div>
        <h2 id="r-shengxiao"></h2>
        <div class="sub" id="r-xingzuo"></div>
      </div>
    </div>

    <div class="oheng-card">
      <h3>타고난 기운</h3>
      <div class="oheng-bars" id="r-oheng-bars"></div>
      <p class="oheng-summary" id="r-oheng-summary"></p>
      <details class="raw-detail">
        <summary>전문 용어로 보기</summary>
        <div id="r-raw-pillars"></div>
      </details>
    </div>

    <div class="upsell-card">
      <h3>내 성격·연애·재물운까지 자세히 알고 싶다면?</h3>
      <p>지금 나온 결과를 바탕으로, 개인 맞춤 상세 해석을 만들어드립니다.</p>
      <button id="upsell-btn">상세 해석 신청하기</button>
    </div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="lib/lunar.js"></script>
<script src="js/saju-calc.js"></script>
<script>
  const yearSel = document.getElementById("f-year");
  const monthSel = document.getElementById("f-month");
  const daySel = document.getElementById("f-day");
  const hourSel = document.getElementById("f-hour");
  const unknownTimeChk = document.getElementById("f-unknown-time");

  const nowYear = 2026; // 부모/조부모 세대까지 포괄
  for (let y = nowYear; y >= 1930; y--) {
    const opt = document.createElement("option");
    opt.value = y; opt.textContent = y + "년";
    if (y === 1995) opt.selected = true;
    yearSel.appendChild(opt);
  }
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement("option");
    opt.value = m; opt.textContent = m + "월";
    monthSel.appendChild(opt);
  }
  function fillDays(daysInMonth) {
    const prev = daySel.value;
    daySel.innerHTML = "";
    for (let d = 1; d <= daysInMonth; d++) {
      const opt = document.createElement("option");
      opt.value = d; opt.textContent = d + "일";
      daySel.appendChild(opt);
    }
    if (prev && prev <= daysInMonth) daySel.value = prev;
  }
  fillDays(31);
  monthSel.addEventListener("change", () => {
    const y = Number(yearSel.value), m = Number(monthSel.value);
    fillDays(new Date(y, m, 0).getDate());
  });
  for (let h = 0; h < 24; h++) {
    const opt = document.createElement("option");
    opt.value = h; opt.textContent = h + "시";
    hourSel.appendChild(opt);
  }
  unknownTimeChk.addEventListener("change", () => {
    hourSel.disabled = unknownTimeChk.checked;
  });

  const OHENG_ORDER = ["목", "화", "토", "금", "수"];
  const OHENG_COLOR = { 목: "#22d3aa", 화: "#ff7a5c", 토: "#ffb347", 금: "#c9c9d6", 수: "#5c9dff" };

  document.getElementById("saju-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = {
      year: Number(yearSel.value),
      month: Number(monthSel.value),
      day: Number(daySel.value),
      hour: Number(hourSel.value),
      unknownTime: unknownTimeChk.checked,
    };
    const result = calculateSaju(input);
    renderResult(result);
    gtag('event', 'saju_calculate');
  });

  function renderResult(result) {
    document.getElementById("r-shengxiao").textContent = result.shengxiao;
    document.getElementById("r-emoji").textContent = result.shengxiaoEmoji;
    document.getElementById("r-xingzuo").textContent = result.xingzuo;

    const maxCount = Math.max(1, ...Object.values(result.ohengCount));
    const barsEl = document.getElementById("r-oheng-bars");
    barsEl.innerHTML = OHENG_ORDER.map((k) => {
      const n = result.ohengCount[k];
      const pct = Math.round((n / maxCount) * 100);
      return `<div class="oheng-bar-row"><span class="name">${k}</span>
        <div class="oheng-bar-track"><div class="oheng-bar-fill" style="width:${pct}%;background:${OHENG_COLOR[k]}"></div></div>
        <span>${n}</span></div>`;
    }).join("");

    document.getElementById("r-oheng-summary").textContent = buildOhengSummary(result);

    const p = result.pillars;
    document.getElementById("r-raw-pillars").textContent =
      `연주 ${p.year} · 월주 ${p.month} · 일주 ${p.day}` + (p.hour ? ` · 시주 ${p.hour}` : " · 시주(시간 미상)") +
      ` (음력 환산: ${result.lunarText})`;

    document.getElementById("saju-result").style.display = "block";
    document.getElementById("saju-result").scrollIntoView({ behavior: "smooth" });
  }

  document.getElementById("upsell-btn").addEventListener("click", () => {
    contactPurchase("사주 상세 해석 신청", "무료 계산기에서 나온 제 사주로 상세 해석을 받고 싶습니다. 생년월일시: ");
  });
</script>
<script src="../js/common.js"></script>
</body>
</html>
