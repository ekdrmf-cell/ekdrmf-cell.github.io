<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="alternate icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NR3D3FD597"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NR3D3FD597');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>무료 궁합 계산기 — 서비스허브</title>
<meta name="description" content="두 사람의 생년월일시로 타고난 기운이 서로 어떻게 맞는지 쉬운 말로 보여주는 무료 궁합 계산기." />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../saju/css/saju.css" />
<script src="../js/config.js"></script>
</head>
<body data-active="saju" data-root="../">
<header id="site-header" class="site-header"></header>

<div class="saju-wrap">
  <h1 class="saju-title">무료 궁합 계산기</h1>
  <p class="saju-sub">두 사람의 생년월일시로 타고난 기운이 어떻게 어우러지는지 봐드려요.</p>

  <form class="saju-form" id="gunghap-form">
    <div class="person-block">
      <h3>나</h3>
      <div class="row">
        <select id="a-year" required></select>
        <select id="a-month" required></select>
        <select id="a-day" required></select>
        <select id="a-hour"></select>
      </div>
      <label class="check"><input type="checkbox" id="a-unknown-time" /> 시간을 몰라요</label>
    </div>
    <div class="person-block">
      <h3>상대방</h3>
      <div class="row">
        <select id="b-year" required></select>
        <select id="b-month" required></select>
        <select id="b-day" required></select>
        <select id="b-hour"></select>
      </div>
      <label class="check"><input type="checkbox" id="b-unknown-time" /> 시간을 몰라요</label>
    </div>
    <button type="submit" class="saju-submit">궁합 보기</button>
  </form>

  <div id="gunghap-result">
    <div class="result-hero">
      <div>
        <div id="a-emoji" class="badge-big"></div>
        <div id="a-label"></div>
      </div>
      <div style="font-size:28px;align-self:center;">×</div>
      <div>
        <div id="b-emoji" class="badge-big"></div>
        <div id="b-label"></div>
      </div>
    </div>
    <div class="oheng-card">
      <h3>기운 궁합</h3>
      <p class="oheng-summary" id="r-compat-summary"></p>
    </div>
    <div class="upsell-card">
      <h3>더 자세한 궁합 해석이 궁금하다면?</h3>
      <p>연애·결혼·동업 궁합까지 개인 맞춤으로 자세히 풀어드립니다.</p>
      <button id="upsell-btn">상세 해석 신청하기</button>
    </div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="../saju/lib/lunar.js"></script>
<script src="../saju/js/saju-calc.js"></script>
<script>
  function setupDateSelects(prefix) {
    const yearSel = document.getElementById(`${prefix}-year`);
    const monthSel = document.getElementById(`${prefix}-month`);
    const daySel = document.getElementById(`${prefix}-day`);
    const hourSel = document.getElementById(`${prefix}-hour`);
    const unknownChk = document.getElementById(`${prefix}-unknown-time`);

    for (let y = 2026; y >= 1930; y--) {
      const opt = document.createElement("option");
      opt.value = y; opt.textContent = y + "년";
      if (y === 1995) opt.selected = true;
      yearSel.appendChild(opt);
    }
    for (let m = 1; m <= 12; m++) {
      const opt = document.createElement("option");
      opt.value = m; opt.textContent = m + "월";
      monthSel.appendChild(opt);
    }
    function fillDays(daysInMonth) {
      const prev = daySel.value;
      daySel.innerHTML = "";
      for (let d = 1; d <= daysInMonth; d++) {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = d + "일";
        daySel.appendChild(opt);
      }
      if (prev && prev <= daysInMonth) daySel.value = prev;
    }
    fillDays(31);
    monthSel.addEventListener("change", () => {
      fillDays(new Date(Number(yearSel.value), Number(monthSel.value), 0).getDate());
    });
    for (let h = 0; h < 24; h++) {
      const opt = document.createElement("option");
      opt.value = h; opt.textContent = h + "시";
      hourSel.appendChild(opt);
    }
    unknownChk.addEventListener("change", () => { hourSel.disabled = unknownChk.checked; });

    return () => ({
      year: Number(yearSel.value), month: Number(monthSel.value), day: Number(daySel.value),
      hour: Number(hourSel.value), unknownTime: unknownChk.checked,
    });
  }

  const getA = setupDateSelects("a");
  const getB = setupDateSelects("b");

  document.getElementById("gunghap-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const resultA = calculateSaju(getA());
    const resultB = calculateSaju(getB());

    document.getElementById("a-emoji").textContent = resultA.shengxiaoEmoji;
    document.getElementById("a-label").textContent = `${resultA.shengxiao} · ${resultA.xingzuo}`;
    document.getElementById("b-emoji").textContent = resultB.shengxiaoEmoji;
    document.getElementById("b-label").textContent = `${resultB.shengxiao} · ${resultB.xingzuo}`;
    document.getElementById("r-compat-summary").textContent = buildCompatibilitySummary(resultA, resultB);

    document.getElementById("gunghap-result").style.display = "block";
    document.getElementById("gunghap-result").scrollIntoView({ behavior: "smooth" });
    gtag('event', 'gunghap_calculate');
  });

  document.getElementById("upsell-btn").addEventListener("click", () => {
    contactPurchase("궁합 상세 해석 신청", "무료 궁합 계산기 결과로 상세 해석을 받고 싶습니다. 두 사람 생년월일시: ");
  });
</script>
<script src="../js/common.js"></script>
</body>
</html>
