<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="alternate icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NR3D3FD597"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NR3D3FD597');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>무료 타로 한 장 뽑기 — 서비스허브</title>
<meta name="description" content="궁금한 걸 떠올리고 카드 한 장을 골라보세요. 78장 전체 덱으로 보는 무료 타로." />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../saju/css/saju.css" />
<script src="../js/config.js"></script>
</head>
<body data-active="saju" data-root="../">
<header id="site-header" class="site-header"></header>

<div class="saju-wrap">
  <h1 class="saju-title">무료 타로 한 장 뽑기</h1>
  <p class="saju-sub">궁금한 걸 마음속으로 떠올리고, 끌리는 카드 한 장을 골라보세요.</p>

  <div class="tarot-card-pick" id="card-pick"></div>

  <div id="tarot-result">
    <div class="oheng-card tarot-result-card">
      <div class="emoji" id="r-emoji"></div>
      <h2 id="r-name"></h2>
      <div class="sub" id="r-keyword" style="color:var(--accent-soft);font-weight:700;margin-bottom:12px;"></div>
      <p class="oheng-summary" id="r-text"></p>
      <button class="saju-submit" id="redraw-btn" style="margin-top:16px;">다시 뽑기</button>
    </div>
    <div class="upsell-card">
      <h3>사주ㆍ별자리까지 겹쳐서 더 정확하게 보고 싶다면?</h3>
      <p>지금은 카드 한 장이었지만, 크로스노틱스에서는 켈틱크로스 10장 스프레드에 사주ㆍ별자리
        교차검증까지 더한 진단을 받을 수 있어요.</p>
      <a href="../crossnotics/index.html" id="upsell-btn">크로스노틱스에서 자세히 보기</a>
    </div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/tarot-data.js"></script>
<script>
  const pickEl = document.getElementById("card-pick");
  const TOTAL_BACKS = 22;

  function renderBacks() {
    pickEl.innerHTML = "";
    for (let i = 0; i < TOTAL_BACKS; i++) {
      const div = document.createElement("div");
      div.className = "tarot-card-back";
      div.addEventListener("click", () => drawCard(div));
      pickEl.appendChild(div);
    }
    document.getElementById("tarot-result").style.display = "none";
  }

  function drawCard(clickedEl) {
    [...pickEl.children].forEach((c) => { if (c !== clickedEl) c.classList.add("picked"); });
    clickedEl.classList.add("picked");

    const card = TAROT_DECK[Math.floor(Math.random() * TAROT_DECK.length)];
    document.getElementById("r-emoji").textContent = card.emoji;
    document.getElementById("r-name").textContent = card.name;
    document.getElementById("r-keyword").textContent = card.keyword;
    document.getElementById("r-text").textContent = card.text;

    const resultEl = document.getElementById("tarot-result");
    resultEl.style.display = "block";
    resultEl.scrollIntoView({ behavior: "smooth" });
    gtag('event', 'tarot_draw', { card: card.name });
  }

  document.getElementById("redraw-btn").addEventListener("click", renderBacks);

  renderBacks();
</script>
<script src="../js/common.js"></script>
</body>
</html>
