<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>무료 운세 모음 — 서비스허브</title>
<meta name="description" content="사주·궁합·타로·꿈해몽·혈액형 성격까지, 무료로 바로 확인하는 운세 도구 모음." />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-active="saju" data-root="../">
<header id="site-header" class="site-header"></header>

<main>
  <div class="wrap page-head">
    <span class="kicker">🔮 무료 운세 모음</span>
    <h1>운세 도구 모음</h1>
    <p>생년월일시 기반 사주부터 타로·꿈해몽까지, 전부 무료로 바로 확인할 수 있어요. 더 자세한 개인 맞춤 해석은 각 결과 화면에서 신청할 수 있습니다.</p>
  </div>
  <div class="section">
    <div class="wrap">
      <div class="grid" id="unse-list"></div>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="../js/config.js"></script>
<script src="../js/unse-data.js"></script>
<script src="../js/common.js"></script>
<script>
  const el = document.getElementById("unse-list");
  el.innerHTML = UNSE_TOOLS.map(
    (t) => `
    <a class="card game-card" href="../${t.path}">
      <div class="game-thumb">${t.emoji}</div>
      <div class="game-title">${t.title}</div>
      <div class="game-desc">${t.desc}</div>
    </a>
  `
  ).join("");
</script>
</body>
