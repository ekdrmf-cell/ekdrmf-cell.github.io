<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
<link rel="alternate icon" href="../favicon.ico" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NR3D3FD597"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-NR3D3FD597');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이름 발음오행 분석 — 천지인운명관</title>
<meta name="description" content="이름 소리(초성)로 오행 흐름을 분석하는 무료 발음오행 이름풀이." />
<link rel="stylesheet" href="../crossnotics/css/base.css" />
<link rel="stylesheet" href="../saju/css/saju.css" />
<script src="../crossnotics/js/config.js"></script>
</head>
<body data-active="tools" data-root="../">
<header id="site-header" class="site-header"></header>

<div class="saju-wrap">
  <h1 class="saju-title">이름 발음오행 분석</h1>
  <p class="saju-sub">이름을 한글로 입력하면 소리(초성)의 오행 흐름을 봐드려요.</p>
  <p class="oheng-summary" style="color:var(--text-faint);font-size:13px;margin-bottom:16px;">
    * 한자 획수로 길흉을 따지는 "81수리" 방식은 작명소마다 계산법이 달라 결과가 정반대로 나오는 경우가 많고 학술적 근거도 약하다는 지적이 있어, 여기서는 쓰지 않습니다. 대신 훈민정음 발음 원리에 기반한 "발음오행"만 봅니다.
  </p>

  <form class="saju-form" id="name-form">
    <input type="text" id="name-input" placeholder="이름을 입력하세요 (예: 김민준)" maxlength="6" style="background:var(--bg-elevated);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:16px;" />
    <button type="submit" class="saju-submit">오행 분석하기</button>
  </form>

  <div id="name-result" style="display:none;margin-top:24px;">
    <div class="oheng-card">
      <h3 id="r-seq" style="font-size:1.3rem;"></h3>
      <p class="oheng-summary" id="r-flow"></p>
    </div>
    <div class="oheng-card" id="r-letters"></div>
    <div class="upsell-card">
      <h3>사주에 맞는 이름인지 더 자세히 알고 싶다면?</h3>
      <p>타고난 사주를 실제로 계산해서 부족한 오행을 이름으로 어떻게 보완하면 좋을지, 천지인운명관에서 더 깊게 확인할 수 있어요.</p>
      <a href="../crossnotics/index.html" id="upsell-btn">천지인운명관에서 자세히 보기</a>
    </div>
  </div>
</div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/name-calc.js"></script>
<script>
  const OHENG_INFO = {
    목: { emoji: "🌳", label: "나무(목)", trait: "성장과 유연함, 앞으로 나아가려는 추진력" },
    화: { emoji: "🔥", label: "불(화)", trait: "열정과 표현력, 사람을 끌어당기는 밝은 에너지" },
    토: { emoji: "⛰️", label: "흙(토)", trait: "안정감과 신뢰, 꾸준히 버텨내는 포용력" },
    금: { emoji: "⚔️", label: "쇠(금)", trait: "결단력과 원칙, 맺고 끊는 게 분명한 판단력" },
    수: { emoji: "💧", label: "물(수)", trait: "지혜와 유연한 사고, 상황에 맞춰 흐르는 적응력" },
  };

  document.getElementById("name-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("name-input").value;
    const result = analyzeNameOheng(name);
    gtag('event', 'name_analyze');

    if (!result) {
      document.getElementById("name-result").style.display = "block";
      document.getElementById("r-seq").textContent = "";
      document.getElementById("r-flow").textContent = "한글 이름 2글자 이상을 입력해주세요 (자음/모음이 결합된 완성형 글자만 인식돼요).";
      document.getElementById("r-letters").innerHTML = "";
      return;
    }

    const summary = buildNameSummary(result);
    document.getElementById("r-seq").textContent = summary.seq;
    document.getElementById("r-flow").textContent = summary.flow;
    document.getElementById("r-letters").innerHTML = result.letters.map((l) => {
      const info = OHENG_INFO[l.oheng];
      return `<p class="oheng-summary">${info.emoji} <b>${l.char}</b> — ${info.label}: ${info.trait}</p>`;
    }).join("");

    const resultEl = document.getElementById("name-result");
    resultEl.style.display = "block";
    resultEl.scrollIntoView({ behavior: "smooth" });
  });
</script>
<script src="../crossnotics/js/common.js"></script>
</body>
</html>
